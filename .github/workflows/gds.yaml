name: gds

# Two hours a run, so only changes reaching the chip or its gate-level test start one.
# OCaml reaches it through the committed Verilog, kept current by the ocaml workflow.
on:
  push:
    paths:
      - src/**
      - macro/**
      - info.yaml
      - librelane_plugin_sram_pdn.py
      - odb_sram_stripes.py
      - test/**
      - .github/workflows/gds.yaml
      - demo/decode.py
      - demo/sigrok.py
      # what the gate-level test never reads: the OCaml's tests, the RTL-only demo, SWD
      # and outside chip tests, the Icepi's testbench and models, and the scripts CI runs
      # elsewhere
      - '!test/assemble/**'
      - '!test/certify/**'
      - '!test/split/**'
      - '!test/python/**'
      - '!test/**.md'
      - '!test/test_demo.py'
      - '!test/test_demo_board.py'
      - '!test/test_outside.py'
      - '!test/test_swd.py'
      - '!test/swd_target.py'
      - '!test/tb_icepi.v'
      - '!test/tb_outside.v'
      - '!test/tb.gtkw'
      - '!test/models/DP16KD.v'
      - '!test/models/EHXPLLL.v'
      - '!test/models/spiflash.v'
      - '!test/mutate.py'
      - '!test/mutation_allow.txt'
      - '!test/results.py'
      - '!test/check_docs.py'
      - '!test/heldout.sha256'
      - '!**.ml'
      - '!**.mli'
      - '!**/dune'
  workflow_dispatch:

concurrency:
  group: gds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

      # the flow has no setup checker and goes green on negative slack
      - name: Check timing and signoff
        run: python3 test/check_metrics.py runs/wokwi/final/metrics.json

      # a failed check is when the numbers matter most
      - name: Log the metrics
        if: success() || failure()
        run: |
          python3 test/check_metrics.py --csv runs/wokwi/final/metrics.json > metrics.csv
          { echo '```'; cat metrics.csv; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the metrics
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: metrics
          path: metrics.csv

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

      # the action leaves the netlist, the PDK and cocotb in place; each trace is written
      # again with the outputs the gates drove, even one that differs from the RTL's
      - name: Replay the pin traces on the gate level
        id: replay
        run: |
          cd test
          REPLAY_TRACES='traces/*.trace traces/sigrok/*.trace' REPLAY_RECORD=gl_traces \
            make replay GATES=yes

      - name: Install sigrok-cli
        if: (success() || failure()) && steps.replay.outcome != 'skipped'
        run: sudo apt-get update && sudo apt-get install -y sigrok-cli

      # what the gates drove, judged as the ocaml workflow's decode job judges the RTL's;
      # after a failed replay this says which protocols the difference breaks
      - name: Decode the gate level's traces with sigrok
        if: (success() || failure()) && steps.replay.outcome != 'skipped'
        run: |
          sigrok-cli -V | head -1
          python3 demo/decode.py --summary "the gate-level netlist" test/gl_traces/*.trace
          python3 demo/decode.py --rate 24 --seed 1 --summary "the gate-level netlist" \
            test/gl_traces/*.trace

      - name: Publish the gate level's traces
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: gl_traces
          path: test/gl_traces

  # the hardened netlist equals the RTL (formal/netlist_equiv); on IHP tt_submission
  # carries the unpowered final/nl, so that is what this proves
  netlist_equiv:
    needs: gds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Download the netlist
        uses: actions/download-artifact@v7
        with:
          name: tt_submission
          path: hardened

      - name: Install OSS CAD Suite
        run: |
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz | tar xz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      # the cell models and Liberty of the PDK revision the netlist was hardened with
      - name: Fetch the standard cells
        run: |
          rev=$(jq -r .PDK_VERSION hardened/tt_submission/pdk.json)
          cells=ihp-sg13cmos5l/libs.ref/sg13cmos5l_stdcell
          url=https://raw.githubusercontent.com/IHP-GmbH/IHP-Open-PDK/$rev/$cells
          mkdir -p "$HOME/pdk/$cells/verilog" "$HOME/pdk/$cells/lib"
          curl -sfL "$url/verilog/sg13cmos5l_stdcell.v" -o "$HOME/pdk/$cells/verilog/sg13cmos5l_stdcell.v"
          curl -sfL "$url/lib/sg13cmos5l_stdcell_typ_1p20V_25C.lib" \
            -o "$HOME/pdk/$cells/lib/sg13cmos5l_stdcell_typ_1p20V_25C.lib"
          echo "PDK_ROOT=$HOME/pdk" >> "$GITHUB_ENV"

      - name: Prove the netlist equal to the RTL, and fail on five mutants
        run: |
          make -C formal netlist_equiv netlist_equiv_teeth \
            NETLIST="$GITHUB_WORKSPACE/hardened/tt_submission/tt_um_marcosash_protocol_emulator.v"

      # formal/sync/check.tcl
      - name: Check one clock and a two-flop synchroniser on every pin, and fail on five mutants
        run: |
          make -C formal sync_gate sync_gate_teeth \
            NETLIST="$GITHUB_WORKSPACE/hardened/tt_submission/tt_um_marcosash_protocol_emulator.v"
