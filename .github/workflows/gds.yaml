name: gds

# A run is two hours, so only what reaches the chip or its gate level test starts one.
# The OCaml reaches it through the committed Verilog, which the ocaml workflow keeps current.
on:
  push:
    paths:
      - src/**
      - macro/**
      - info.yaml
      - librelane_plugin_sram_pdn.py
      - odb_sram_stripes.py
      - test/**
      - .github/workflows/gds.yaml
      - '!**.ml'
      - '!**.mli'
      - '!**/dune'
  workflow_dispatch:

concurrency:
  group: gds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

      # the flow has no setup checker and goes green on negative slack
      - name: Check timing and signoff
        run: python3 test/check_metrics.py runs/wokwi/final/metrics.json

      # a failed check is when the numbers matter most
      - name: Log the metrics
        if: success() || failure()
        run: |
          python3 test/check_metrics.py --csv runs/wokwi/final/metrics.json > metrics.csv
          { echo '```'; cat metrics.csv; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish the metrics
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: metrics
          path: metrics.csv

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

      # the action leaves the netlist, the PDK and cocotb in place
      - name: Replay the pin traces on the gate level
        run: |
          cd test
          make replay GATES=yes

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
