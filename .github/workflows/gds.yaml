name: gds

# A run is two hours, so only what reaches the chip or its gate level test starts one.
# The OCaml reaches it through the committed Verilog, which the ocaml workflow keeps current.
on:
  push:
    paths:
      - src/**
      - macro/**
      - info.yaml
      - librelane_plugin_sram_pdn.py
      - odb_sram_stripes.py
      - test/**
      - .github/workflows/gds.yaml
      - '!**.ml'
      - '!**.mli'
      - '!**/dune'
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ihp-cmos5l
        with:
          pdk: ihp-sg13cmos5l

      # the flow has no setup checker and goes green on negative slack
      - name: Check timing and signoff
        run: python3 test/check_metrics.py runs/wokwi/final/metrics.json

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ihp-cmos5l

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ihp-cmos5l

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ihp-cmos5l
