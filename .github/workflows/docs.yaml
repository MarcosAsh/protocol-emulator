name: docs

on:
  push:
    branches: ['**']
  # a link dies, or a newer run makes a cited one stale, with no push
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ihp-cmos5l

  # what README.md and docs/info.md cite and quote, against the repo, its runs, the pinned
  # evidence releases and the links' pages, then wrong copies of the README that have to
  # fail (test/check_docs.py)
  check:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the cited commits have to be ancestors of HEAD

      # release assets test/evidence.sha256 pins, which never change
      - name: Cache the evidence
        uses: actions/cache@v4
        with:
          path: ~/.cache/protocol-emulator/evidence
          key: evidence-${{ hashFiles('test/evidence.sha256') }}

      # links that answered, asked again after a day
      - name: Cache the links
        uses: actions/cache@v4
        with:
          path: ~/.cache/protocol-emulator/links.json
          key: links-${{ github.run_id }}
          restore-keys: links-

      - name: Check the docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 test/check_docs.py
          python3 test/check_docs.py --teeth
