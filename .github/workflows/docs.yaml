name: docs

on:
  push:
    branches: ['**']
  # weekly, since a link can die or a newer run can make a cited one stale without a push
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build docs
        uses: TinyTapeout/tt-gds-action/docs@ihp-cmos5l

  # the site's pages, built the way pages.yaml builds them on main
  site:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the site
        run: |
          pip install -r docs/requirements.txt
          sphinx-build -W -b html docs docs/_build/html

  # checks what README.md and docs/ cite and quote against the repo, its runs, the pinned
  # evidence releases and the linked pages, then checks that wrong copies of the README
  # fail (test/check_docs.py)
  check:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the cited commits have to be ancestors of HEAD

      # the release assets pinned by test/evidence.sha256, which never change
      - name: Cache the evidence
        uses: actions/cache@v4
        with:
          path: ~/.cache/protocol-emulator/evidence
          key: evidence-${{ hashFiles('test/evidence.sha256') }}

      # links that answered are only asked again after a day
      - name: Cache the links
        uses: actions/cache@v4
        with:
          path: ~/.cache/protocol-emulator/links.json
          key: links-${{ github.run_id }}
          restore-keys: links-

      - name: Check the docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 test/check_docs.py
          python3 test/check_docs.py --teeth
