name: pages

# The playground from main, the results page and the live die, beside the 3D viewer of the
# last green gds run on main, the only workflow that deploys the site. Runs after gds and
# results.
# js_of_ocaml is never locked.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - playground/**
      - pages/**
      - test/*.asm
      - dune-project
      - protocol_emulator.opam.locked
      - .github/workflows/pages.yaml
  workflow_run:
    workflows: [gds, results]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# a run in progress finishes, so a burst of triggers cannot cancel every deploy; the
# newest waits behind it
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  playground:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # the page as last built from these inputs, so new results alone skip the switch
      - name: Cache the playground
        id: built
        uses: actions/cache@v4
        with:
          path: |
            _build/default/playground/index.html
            _build/default/playground/playground.bc.js
          key: playground-${{ hashFiles('src/**', 'playground/**', 'test/*.asm', 'dune-project', 'protocol_emulator.opam.locked', '.github/workflows/pages.yaml') }}

      - name: Set up OxCaml
        if: steps.built.outputs.cache-hit != 'true'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      # the ocaml workflow's switch, a superset of the locked one; not saved with
      # js_of_ocaml in it, whose freed guards the locked install would put back
      - name: Restore the switch
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.2.0+ox-test-${{ hashFiles('protocol_emulator.opam.locked') }}

      # js_of_ocaml alone would move dune off 3.22.2+ox and rebuild without hardcaml, so
      # every locked package is held at its version. It and its sedlex and yojson are the
      # oxcaml patched ones, whose -patches packages replace the four guards left free.
      - name: Install dependencies
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          opam install . --deps-only --locked
          opam install js_of_ocaml.6.3.2+ox sedlex.3.7+ox yojson.2.2.2+ox \
            oxcaml-js_of_ocaml-patches oxcaml-js_of_ocaml-compiler-patches \
            oxcaml-sedlex-patches oxcaml-yojson-patches \
            $(opam list --installed --short --color=never --columns=name,version \
              | awk '$1 !~ /^oxcaml-(js_of_ocaml|js_of_ocaml-compiler|sedlex|yojson)$/ { print $1 "." $2 }')

      # the release profile links the whole program, 0.8 MB against 31 MB
      - name: Build the playground
        if: steps.built.outputs.cache-hit != 'true'
        run: PLAYGROUND=yes opam exec -- dune build --profile release @playground/page

      # the page is only worth publishing if the kernel still refuses the example it
      # shows refusing
      - name: Check the examples' verdicts
        working-directory: _build/default/playground
        run: |
          node -e '
            const pe = require("./playground.bc.js").protocolEmulator;
            const verdicts = pe.examples.map(([name, source]) =>
              name + ": " + pe.check(source, null, false, 0, false).verdict);
            console.log(verdicts.join("\n"));
            const want = ["uart_tx: accepted", "gap_adding_x: refused by the kernel"];
            if (!want.every((v) => verdicts.includes(v))) process.exit(1);
          '

      - name: Upload the playground
        uses: actions/upload-artifact@v7
        with:
          name: playground
          path: |
            _build/default/playground/index.html
            _build/default/playground/playground.bc.js

  deploy:
    needs: playground
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}playground/
    steps:
      - name: Download the playground
        uses: actions/download-artifact@v7
        with:
          name: playground
          path: site/playground

      # as committed: demo/live_die.py makes its data from one gds run, by hand
      - name: Checkout the live die
        uses: actions/checkout@v6
        with:
          sparse-checkout: pages/die
          path: repo

      - name: Add the live die
        run: |
          mkdir -p site/die
          cp repo/pages/die/index.html repo/pages/die/die.js repo/pages/die/die.bin site/die/

      # test/results.py's page from the last results run that passed; the site goes up
      # without it rather than not at all
      - name: Download the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "${{ github.repository }}" --workflow results.yaml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId') || true
          if gh run download "$run" -R "${{ github.repository }}" -n results -D results \
            && [ -f results/results.html ]; then
            mkdir -p site/results
            cp results/results.html site/results/index.html
            echo "results from results run $run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no results page in results run $run"
          fi

      # what TinyTapeout/tt-gds-action/viewer publishes, from the last run that passed
      - name: Download the chip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "${{ github.repository }}" --workflow gds.yaml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run" -R "${{ github.repository }}" -n tt_submission -n gds_render -D chip
          cp chip/tt_submission/tt_submission/*.gds site/tinytapeout.gds
          cp chip/tt_submission/tt_submission/*.oas site/tinytapeout.oas
          cp chip/gds_render/gds_render.png site/
          pdk=$(jq -r .PDK chip/tt_submission/tt_submission/pdk.json)
          results=""
          [ -f site/results/index.html ] && results='<p><a href="results/">Results</a></p>'
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Redirecting to 3D Viewer...</title></head>
          <body>
          <script>
            location.href = "https://gds-viewer.tinytapeout.com/?pdk=$pdk&model="
              + encodeURIComponent(location.href + "/tinytapeout.oas");
          </script>
          <p><a href="playground/">Firmware timing playground</a></p>
          <p><a href="die/">Live die</a></p>
          $results
          </body>
          </html>
          EOF
          echo "chip from gds run $run" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
