name: pages

# The docs from docs/ as the site's root, the playground from main, the results page and the
# live die, beside the 3D viewer of the last green gds run on main and the staged 8x4 chip, the
# only workflow that deploys the site. Runs after gds and results.
# js_of_ocaml is never locked.
on:
  push:
    branches: [main]
    paths:
      - src/**
      - pio/src/**
      - pio/test/pico_examples/i2c.pio
      - playground/**
      - pages/**
      - docs/**
      - info.yaml
      - test/*.asm
      - test/*.ml
      - test/diagrams/**
      - bin/**
      - test/corpus.py
      - test/certify/**
      - demo/speed.tsv
      - demo/ledger.tsv
      - python/clock_cliffs.py
      - dune-project
      - protocol_emulator.opam.locked
      - .github/workflows/pages.yaml
  workflow_run:
    workflows: [gds, results]
    types: [completed]
    # main and CHIP_8X4_BRANCHES below; keep the two lists in step
    branches: [main, fill-8x4, failsafe-8x4, onchip-8x4]
  workflow_dispatch:

# a run in progress finishes, so a burst of triggers cannot cancel every deploy; the
# newest waits behind it
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

# the staged 8x4 builds, in order; the first with a green gds run goes up at 8x4/
env:
  CHIP_8X4_BRANCHES: fill-8x4 failsafe-8x4 onchip-8x4

jobs:
  playground:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      # the page as last built and checked against the cli from these inputs, so new
      # results alone skip the switch
      - name: Cache the playground
        id: built
        uses: actions/cache@v4
        with:
          path: |
            _build/default/playground/index.html
            _build/default/playground/lab.html
            _build/default/playground/playground.bc.js
          key: playground-${{ hashFiles('src/**', 'pio/src/**', 'pio/test/pico_examples/i2c.pio', 'playground/**', 'test/*.asm', 'test/*.ml', 'test/dune', 'test/diagrams/**', 'bin/**', 'ppx/**', 'dune-project', 'protocol_emulator.opam.locked', '.github/workflows/pages.yaml') }}

      - name: Set up OxCaml
        if: steps.built.outputs.cache-hit != 'true'
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      # the ocaml workflow's switch, a superset of the locked one; not saved with
      # js_of_ocaml in it, whose freed guards the locked install would put back
      - name: Restore the switch
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.2.0+ox-test-${{ hashFiles('protocol_emulator.opam.locked') }}

      # js_of_ocaml alone would move dune off 3.22.2+ox and rebuild without hardcaml, so
      # every locked package is held at its version. It and its sedlex and yojson are the
      # oxcaml patched ones, whose -patches packages replace the four guards left free.
      - name: Install dependencies
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          opam install . --deps-only --locked
          opam install js_of_ocaml.6.3.2+ox sedlex.3.7+ox yojson.2.2.2+ox \
            oxcaml-js_of_ocaml-patches oxcaml-js_of_ocaml-compiler-patches \
            oxcaml-sedlex-patches oxcaml-yojson-patches \
            $(opam list --installed --short --color=never --columns=name,version \
              | awk '$1 !~ /^oxcaml-(js_of_ocaml|js_of_ocaml-compiler|sedlex|yojson)$/ { print $1 "." $2 }')

      # the release profile links the whole program, 0.8 MB against 31 MB
      - name: Build the playground
        if: steps.built.outputs.cache-hit != 'true'
        run: PLAYGROUND=yes opam exec -- dune build --profile release @playground/page @playground/lab

      # the page is the cli: each library firmware through both, and each diagram at 48
      # and 50 MHz through the page and a native build, byte for byte
      - name: Check the page against the cli
        if: steps.built.outputs.cache-hit != 'true'
        run: PLAYGROUND=yes opam exec -- dune build --profile release @playground/agree

      # the page is only worth publishing if the kernel still refuses the example it
      # shows refusing, and pio_check still fails #796
      - name: Check the examples' verdicts
        working-directory: _build/default/playground
        run: |
          node -e '
            const pe = require("./playground.bc.js").protocolEmulator;
            const verdicts = pe.examples.map(([name, source]) =>
              name + ": " + pe.check(source, null, false, 0, false).verdict);
            console.log(verdicts.join("\n"));
            const pio = pe.pioExamples.map(([name, source, spec]) =>
              name + ": " + pe.checkPio(source, spec).verdict);
            console.log(pio.join("\n"));
            const want = ["uart_tx: accepted", "gap_adding_x: refused by the kernel"];
            const wantPio = ["i2c (#796): failed"];
            if (!want.every((v) => verdicts.includes(v))) process.exit(1);
            if (!wantPio.every((v) => pio.includes(v))) process.exit(1);
          '

      - name: Upload the playground
        uses: actions/upload-artifact@v7
        with:
          name: playground
          path: |
            _build/default/playground/index.html
            _build/default/playground/lab.html
            _build/default/playground/playground.bc.js

  # test/corpus.py's pages from the library and the repo's data files; the site goes up
  # without them rather than not at all. Same switch as the playground, without
  # js_of_ocaml.
  corpus:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      - name: Restore the switch
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.2.0+ox-test-${{ hashFiles('protocol_emulator.opam.locked') }}

      - name: Install dependencies
        run: opam install . --deps-only --locked

      # the firmware CI proves certificates of, as its inductive_certificate matrix is made
      - name: Write the library's data
        run: |
          opam exec -- dune build ./test/certify/write_corpus.exe ./test/certify/write_certificate.exe
          _build/default/test/certify/write_corpus.exe corpus-data
          _build/default/test/certify/write_certificate.exe -names > corpus-data/matrix

      # the board ledgers are release assets, not downloaded here, so only the repo's own
      - name: Write the corpus
        run: |
          set -- --data corpus-data --out corpus --matrix corpus-data/matrix \
            --ledger demo/ledger.tsv
          [ -f python/clock_cliffs.py ] && set -- "$@" --cliffs python/clock_cliffs.py
          python3 test/corpus.py "$@"
          python3 test/corpus.py --check corpus

      - name: Upload the corpus
        uses: actions/upload-artifact@v7
        with:
          name: corpus
          path: corpus

  deploy:
    needs: [playground, corpus]
    # the corpus job may fail without stopping the site
    if: ${{ !cancelled() && needs.playground.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the playground
        uses: actions/download-artifact@v7
        with:
          name: playground
          path: site/playground

      # as committed: demo/live_die.py makes the die's data from one gds run, by hand
      - name: Checkout the pages
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            pages
            docs
          path: repo

      # docs/ in Sphinx, the site's root, which the pages below go up beside
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the docs
        run: |
          pip install -r repo/docs/requirements.txt
          sphinx-build -W -b html repo/docs docs-html
          cp -r docs-html/. site/
          rm -rf site/.doctrees site/.buildinfo

      - name: Add the live die
        run: |
          mkdir -p site/die
          cp repo/pages/die/index.html repo/pages/die/die.js repo/pages/die/die.bin site/die/

      # test/corpus.py's pages from the corpus job; the site goes up without them
      - name: Download the corpus
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: corpus
          path: site/corpus

      # test/results.py's page from the last results run that passed; the site goes up
      # without it rather than not at all
      - name: Download the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "${{ github.repository }}" --workflow results.yaml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId') || true
          if gh run download "$run" -R "${{ github.repository }}" -n results -D results \
            && [ -f results/results.html ]; then
            mkdir -p site/results
            cp results/results.html site/results/index.html
            echo "results from results run $run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no results page in results run $run"
          fi

      # what TinyTapeout/tt-gds-action/viewer publishes, from the last run that passed
      - name: Download the chip
        id: chip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "${{ github.repository }}" --workflow gds.yaml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run" -R "${{ github.repository }}" -n tt_submission -n gds_render -D chip
          cp chip/tt_submission/tt_submission/*.gds site/tinytapeout.gds
          cp chip/tt_submission/tt_submission/*.oas site/tinytapeout.oas
          cp chip/gds_render/gds_render.png site/
          echo "pdk=$(jq -r .PDK chip/tt_submission/tt_submission/pdk.json)" >> "$GITHUB_OUTPUT"
          echo "chip from gds run $run" >> "$GITHUB_STEP_SUMMARY"

      # what the newest green gds run of the first 8x4 branch to have one built; the site
      # goes up without it rather than not at all. No die by module: demo/die.py needs the
      # PDK's cell LEFs and the 400 MB run directory.
      - name: Add the 8x4 chip
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=
          for branch in $CHIP_8X4_BRANCHES; do
            read -r run sha < <(gh run list -R "${{ github.repository }}" --workflow gds.yaml \
              --branch "$branch" --status success --limit 1 --json databaseId,headSha \
              --jq '.[] | "\(.databaseId) \(.headSha)"') || continue
            rm -rf chip8x4
            if gh run download "$run" -R "${{ github.repository }}" -n tt_submission \
              -n gds_render -D chip8x4; then
              found=yes
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "no 8x4 page: no green gds run on $CHIP_8X4_BRANCHES" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sub=chip8x4/tt_submission/tt_submission
          tiles=$(sed -n 's/^ *tiles: *"\([^"]*\)".*/\1/p' chip8x4/tt_submission/info.yaml)
          if [ "$tiles" != 8x4 ]; then
            echo "::warning::gds run $run on $branch is $tiles tiles, no 8x4 page"
            exit 0
          fi
          mkdir page8x4
          cp repo/pages/8x4/index.html page8x4/
          cp "$sub"/*.gds page8x4/tinytapeout.gds
          cp "$sub"/*.oas page8x4/tinytapeout.oas
          cp chip8x4/gds_render/gds_render.png page8x4/
          pdk=$(jq -r .PDK "$sub/pdk.json")
          cells='' util=''
          if [ -f "$sub/stats/metrics.csv" ]; then
            cells=$(awk -F, '$1 == "design__instance__count__stdcell" { print $2 }' \
              "$sub/stats/metrics.csv")
            util=$(awk -F, '$1 == "design__instance__utilization" { printf "%.1f%%", 100 * $2 }' \
              "$sub/stats/metrics.csv")
          fi
          if [ -z "$cells" ] || [ -z "$util" ]; then
            sed -i '/<!-- metrics -->/,/<!-- \/metrics -->/d' page8x4/index.html
          fi
          sed -i -e "s|@branch@|$branch|g" -e "s|@sha@|$sha|g" -e "s|@short@|${sha:0:7}|g" \
            -e "s|@run@|$run|g" -e "s|@pdk@|$pdk|g" -e "s|@cells@|$cells|g" \
            -e "s|@util@|$util|g" page8x4/index.html
          if grep -q '@[a-z]*@' page8x4/index.html; then
            echo "::warning::8x4 page has unfilled fields, left out"
            exit 0
          fi
          mv page8x4 site/8x4
          echo "8x4 chip from gds run $run, $branch at $sha" >> "$GITHUB_STEP_SUMMARY"
          echo "8x4 die by module left out, it needs the PDK's LEFs" >> "$GITHUB_STEP_SUMMARY"

      # the viewer's pdk as the gds run has it, and the results, corpus and 8x4 links only
      # when their pages went up
      - name: Finish the landing page
        env:
          PDK: ${{ steps.chip.outputs.pdk }}
        run: |
          cp repo/docs/die.png repo/docs/architecture.svg repo/info.yaml site/
          sed -i -e "s|?pdk=[^&]*&|?pdk=$PDK\&|" site/index.html
          grep -q "?pdk=$PDK&" site/index.html
          [ -f site/results/index.html ] || sed -i '/<!-- results -->/,/<!-- \/results -->/d' site/index.html
          [ -f site/corpus/index.html ] || sed -i '/<!-- corpus -->/,/<!-- \/corpus -->/d' site/index.html
          [ -f site/8x4/index.html ] || sed -i '/<!-- 8x4 -->/,/<!-- \/8x4 -->/d' site/index.html

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
