name: release

# Publishes the assembler, the firmware, the chip and its FPGA bitstream as files, for
# anyone without the OxCaml switch. The binary needs glibc 2.39 and libgmp (as on Ubuntu
# 24.04). Run by hand it is a dry run: everything is built and checked, errors become
# warnings, and the result is uploaded as an artifact instead of released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      LEVEL: ${{ github.event_name == 'push' && 'error' || 'warning' }}
    steps:
      # full history, so we can compare src/ with the gds run's commit
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      # oxcaml.latest needs the 5.4 compiler after their 5.4.0-ox9 merge; pinning here
      # rather than in opam-repositories keeps setup-ocaml's cache key
      - name: Pin the oxcaml opam repository
        run: opam repo set-url ox git+https://github.com/oxcaml/opam-repository.git#a70ed316f02290fa267f9105f30cf21e3c7f5f05

      # the ocaml workflow's switch, a superset of this one's (a tag saves no cache)
      - name: Restore the switch
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.2.0+ox-test-${{ hashFiles('protocol_emulator.opam.locked') }}

      - name: Install dependencies
        run: opam install . --deps-only --locked

      - name: Build the assembler
        run: |
          opam exec -- dune build --profile release bin/generate.exe
          mkdir release
          cp _build/default/bin/generate.exe release/generate-linux-x86_64

      # run outside dune, the way a judge would
      - name: Check the binary reproduces the committed Verilog and firmware
        run: |
          ./release/generate-linux-x86_64 top -sram -engines 2 | cmp - src/protocol_emulator.v
          ./release/generate-linux-x86_64 assemble test/uart_tx.asm | cmp - test/uart_tx.hex
          ./release/generate-linux-x86_64 run -cycles 200 -tx 0x5a test/uart_tx.asm \
            | cmp - test/assemble/uart_tx_run.expected
          if ./release/generate-linux-x86_64 assemble playground/gap_adding_x.asm; then
            echo "::error::the kernel accepted gap_adding_x"
            exit 1
          fi

      - name: Pack the firmware
        run: tar czf release/firmware.tar.gz test/*.asm test/*.hex test/*.settings test/firmware.mk

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      # the build whose netlist the ocaml workflow's fpga job simulates
      - name: Build the bitstream
        run: |
          make -C icepi
          cp icepi/build/v1.4.bit release/icepi-zero-v1.4.bit

      # the gds run the README cites, or the release that keeps it once its artifacts expire
      - name: Download the chip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 test/evidence.py chip chip > chip.env
          . ./chip.env
          cp chip/tt_submission/tt_submission/*.{gds,oas,lef,v} chip/gds_render/gds_render.png release/
          commit=$(jq -r .commit chip/tt_submission/tt_submission/commit_id.json)
          echo "run=$run" >> "$GITHUB_ENV"
          echo "kept=$kept" >> "$GITHUB_ENV"
          echo "commit=$commit" >> "$GITHUB_ENV"
          # the bitstream is built from this checkout, so it is the chip only if what a gds
          # run hardens matches its commit, as test/check_docs.py's same_chip decides
          same='import sys; sys.path.insert(0, "test"); import check_docs; sys.exit(not check_docs.same_chip(sys.argv[1]))'
          if ! python3 -c "$same" "$commit"; then
            echo "::$LEVEL::the chip's sources here differ from $commit, which gds run $run hardened"
            [ "$LEVEL" = warning ]
          fi

      # the bitstream's netlist, simulated by the ocaml workflow's fpga job
      - name: Check the fpga job passed at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "ocaml") | .id')
          # the fpga job is a matrix, so every leg must pass
          green=""
          for id in $runs; do
            legs=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$id/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "fpga" or (.name | startswith("fpga ("))) | .conclusion')
            if [ "$(sort -u <<< "$legs")" = success ]; then green+=$id; fi
          done
          if [ -z "$green" ]; then
            echo "::$LEVEL::no green fpga job in the ocaml workflow at $GITHUB_SHA yet"
            [ "$LEVEL" = warning ]
          fi

      - name: Write the notes
        run: |
          echo "The chip is from gds run $run at $commit." > notes.md
          [ -z "$kept" ] || echo "Release $kept keeps that run's artifacts past GitHub's 90 days." >> notes.md
          cat >> notes.md <<'EOF'
          Assemble and check firmware with no OCaml: `chmod +x generate-linux-x86_64 && ./generate-linux-x86_64 assemble uart_tx.asm`

          The bitstream is built from this tag, whose Verilog is the one that gds run hardened, and the ocaml workflow's fpga job simulated its netlist.

          `icepi-zero-v1.4.bit` is the chip's Verilog, two engines at 48 MHz, for an Icepi Zero v1.3 or v1.4 (ECP5), its pins on the 40-pin header as `icepi/header.lpf` maps them and USB on the first USB-C port. Load it with `openFPGALoader -b icepi-zero icepi-zero-v1.4.bit`, as `make -C icepi prog` does, and add `--write-flash` to keep it. v1.0 to v1.2 take the clock on another ball: `make -C icepi REV=v1.2`.
          EOF

      # the chip, the bitstream and the assembler, signed before they are published
      - name: Attest the release files
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v3.0.0
        with:
          subject-path: release/*

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "${{ github.repository }}" release/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Upload the dry run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            release
            notes.md
