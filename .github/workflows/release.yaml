name: release

# The assembler, the firmware, the chip and its FPGA bitstreams as files, for anyone without
# the OxCaml switch. The binary needs glibc 2.39 and libgmp, as on Ubuntu 24.04. Run by hand
# it is a dry run: everything built and checked, with warnings for errors, and uploaded as an
# artifact instead of released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      LEVEL: ${{ github.event_name == 'push' && 'error' || 'warning' }}
    steps:
      # all of it, to compare src/ with the gds run's commit
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      # the ocaml workflow's switch, a superset of this one's; a tag saves no cache
      - name: Restore the switch
        uses: actions/cache/restore@v4
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.2.0+ox-test-${{ hashFiles('protocol_emulator.opam.locked') }}

      - name: Install dependencies
        run: opam install . --deps-only --locked

      - name: Build the assembler
        run: |
          opam exec -- dune build --profile release bin/generate.exe
          mkdir release
          cp _build/default/bin/generate.exe release/generate-linux-x86_64

      # outside dune, as a judge would run it
      - name: Check the binary reproduces the committed Verilog and firmware
        run: |
          ./release/generate-linux-x86_64 top -sram -engines 4 | cmp - src/protocol_emulator.v
          ./release/generate-linux-x86_64 assemble test/uart_tx.asm | cmp - test/uart_tx.hex
          if ./release/generate-linux-x86_64 assemble playground/gap_adding_x.asm; then
            echo "::error::the kernel accepted gap_adding_x"
            exit 1
          fi

      - name: Pack the firmware
        run: tar czf release/firmware.tar.gz test/*.asm test/*.hex test/*.settings test/firmware.mk

      - name: Install OSS CAD Suite
        run: |
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz | tar xz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      # the kit's top and pin file; tt is not part of this repository
      - name: Checkout tt-support-tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: d66cf179e7bc4d296362ab7e2e3b344dc3c4f665 # ihp-sg13cmos5l, 2026-09-21
          path: tt

      # the builds whose netlists the ocaml workflow's fpga job simulates
      - name: Build the bitstreams
        run: |
          (cd test && opam exec -- make fpga_kit.bin)
          make -C icepi
          cp test/fpga_kit.bin release/tt_um_marcosash_protocol_emulator.bin
          cp icepi/build/v1.4.bit release/icepi-zero-v1.4.bit

      - name: Download the chip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list -R "${{ github.repository }}" --workflow gds.yaml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$run" -R "${{ github.repository }}" -n tt_submission -n gds_render -D chip
          cp chip/tt_submission/tt_submission/*.{gds,oas,lef,v} chip/gds_render/gds_render.png release/
          commit=$(jq -r .commit chip/tt_submission/tt_submission/commit_id.json)
          echo "run=$run" >> "$GITHUB_ENV"
          echo "commit=$commit" >> "$GITHUB_ENV"
          # the bitstreams are built from here, so they are the chip only if what a gds run
          # hardens, as gds.yaml's paths filter has it, is the same here as at its commit
          if ! git diff --quiet "$commit" HEAD -- src macro info.yaml librelane_plugin_sram_pdn.py \
            odb_sram_stripes.py ':!*.ml' ':!*.mli' ':!**/dune'; then
            echo "::$LEVEL::the chip's sources here differ from $commit, which gds run $run hardened"
            [ "$LEVEL" = warning ]
          fi

      # the netlists of both bitstreams, simulated by the ocaml workflow's fpga job
      - name: Check the fpga job passed at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "ocaml") | .id')
          green=""
          for id in $runs; do
            green+=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "fpga" and .conclusion == "success") | .id')
          done
          if [ -z "$green" ]; then
            echo "::$LEVEL::no green fpga job in the ocaml workflow at $GITHUB_SHA yet"
            [ "$LEVEL" = warning ]
          fi

      - name: Write the notes
        run: |
          echo "The chip is from gds run $run at $commit." > notes.md
          cat >> notes.md <<'EOF'
          Assemble and check firmware with no OCaml: `chmod +x generate-linux-x86_64 && ./generate-linux-x86_64 assemble uart_tx.asm`

          Both bitstreams are built from this tag, whose Verilog is the one that gds run hardened, and the ocaml workflow's fpga job simulated their netlists.

          `icepi-zero-v1.4.bit` is the chip's Verilog, four engines at 48 MHz, for an Icepi Zero v1.3 or v1.4 (ECP5), its pins on the 40-pin header as `icepi/header.lpf` maps them and USB on the first USB-C port. Load it with `openFPGALoader -b icepi-zero icepi-zero-v1.4.bit`, as `make -C icepi prog` does, and add `--write-flash` to keep it. v1.0 to v1.2 take the clock on another ball: `make -C icepi REV=v1.2`.

          `tt_um_marcosash_protocol_emulator.bin` is one engine with flop program memory, to fit the iCE40 UP5K on Tiny Tapeout's classic (TT04) FPGA breakout, pins as tt-support-tools' `fpga/tt_fpga_top.pcf`. Copy it to the demo board with `mpremote cp tt_um_marcosash_protocol_emulator.bin :/bitstreams/`, reset the board, select it with `tt.shuttle.tt_um_marcosash_protocol_emulator.enable()` and clock it at 16 MHz or less.
          EOF

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "${{ github.repository }}" release/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

      - name: Upload the dry run
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            release
            notes.md
