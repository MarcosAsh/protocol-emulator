name: test
# branches only: a tag names a commit a branch push has already run
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  # whether a branch's changes reach the cocotb tests (.github/changed.sh); a skip counts
  # as a pass
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rtl: ${{ steps.changed.outputs.rtl }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # to find where the branch left main

      - name: List what changed
        id: changed
        run: .github/changed.sh rtl | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.rtl == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make succeeds even when a test fails, so check results.xml
          ! grep failure results.xml
          make replay

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
