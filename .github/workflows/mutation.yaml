name: mutation
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
jobs:
  mutate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      - name: Install dependencies
        run: |
          sudo apt-get install -y z3
          opam install . --deps-only --with-test --locked

      - name: Mutate the hardware and run the tests on every mutant
        shell: bash
        run: opam exec -- python3 test/mutate.py --jobs 4 | tee mutation.log

      - name: Score
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep "valid mutants\|^survived" -A1 mutation.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
