name: mutation
on:
  # the engine scope's four files, its allowed survivors and the tool that mutates them
  push:
    branches: [main]
    paths:
      - src/engine.ml
      - src/decoder.ml
      - src/pins.ml
      - src/host_port.ml
      - test/mutate.py
      - test/mutation_allow.txt
      - .github/workflows/mutation.yaml
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      scope:
        description: 'engine: the four files of the published score; wide: every file that makes RTL, the kernel and the analyser; kernel: the trusted checker alone'
        type: choice
        options: [engine, wide, kernel]
        default: engine
      ids:
        description: 'only these mutants of the scope, as --list names them, space separated'
        type: string
        default: ''
      shards:
        description: 'jobs to split the mutants over; 0: 4 for engine, 20 for wide, 20 for kernel, one a mutant for ids'
        type: number
        default: 0
      untested:
        description: 'kernel and wide: take every mutant of the checker to the proofs, without the tests'
        type: boolean
        default: false
      proofs:
        description: 'only these of the proofs, as test/mutate.py PROVED names them, space separated'
        type: string
        default: ''

# the held-out sample is a function of this seed and the mutant, fixed before any run
env:
  SCOPE: ${{ inputs.scope || 'engine' }}
  IDS: ${{ inputs.ids }}
  UNTESTED: ${{ inputs.untested }}
  PROOFS: ${{ inputs.proofs }}
  SEED: '20261002'

# twelve shards a run, so a push a later push overtakes is cancelled; a weekly or
# dispatched run always finishes
concurrency:
  group: mutation-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Number the shards
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          n=${SHARDS:-0}
          if [ "$n" -eq 0 ]; then
            if [ -n "$IDS" ]; then n=$(echo $IDS | wc -w); elif [ "$SCOPE" = wide ]; then n=20
            elif [ "$SCOPE" = kernel ]; then n=20; else n=12; fi
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq 0 $((n - 1)) | jq -sc .)" >> "$GITHUB_OUTPUT"

  # a mutant costs about nine runner-minutes, four at a time on four cores: engine's 114
  # in twelve shards of about two hours, wide's thousand in twenty of about three and a half,
  # kernel's 658 and their proofs in twenty, six shards at a time so the other branches keep the rest of the shared runners
  mutate:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SHARDS: ${{ needs.plan.outputs.count }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      # the ocaml workflow's switch; on a hit the install below has nothing to do
      - name: Cache the switch
        uses: actions/cache@v4
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.2.0+ox-test-${{ hashFiles('protocol_emulator.opam.locked') }}

      # no z3: every QED in the tests is cadical's, checked by cake_lpr
      - name: Install dependencies
        run: opam install . --deps-only --with-test --locked

      # cadical and cake_lpr for the checked QEDs (test/checked_unsat.ml), at the pins
      # formal/Makefile names; keyed on those lines alone
      - name: Key the SAT tools
        id: sat_key
        run: echo "key=sat-tools-$(sed -n '/^CADICAL = /,/^$/p' formal/Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the SAT tools
        id: sat_tools
        uses: actions/cache@v4
        with:
          path: formal/sat_tools/bin
          key: ${{ steps.sat_key.outputs.key }}

      - name: Build the SAT tools
        run: |
          [ "${{ steps.sat_tools.outputs.cache-hit }}" = true ] || make -C formal sat_tools
          echo "$PWD/formal/sat_tools/bin" >> "$GITHUB_PATH"

      # wide and kernel take each survivor of the checker to the proofs (test/mutate.py's
      # prove), and one that accepts more to sby
      - name: Install OSS CAD Suite
        if: env.SCOPE != 'engine'
        run: |
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz | tar xz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      # the shard's mutants and which are held out, logged before any is run
      - name: List the mutants
        run: opam exec -- python3 test/mutate.py --scope "$SCOPE" ${IDS:+--id $IDS} --shard "${{ matrix.shard }}/$SHARDS" --seed "$SEED" --list

      # a suite that runs 45 minutes, about three times a mutant's, has hung; so has a proof
      # past 90, but for a few mutants by id, where the slowest pair lemma tasks take 3.6 h
      - name: Mutate and run the tests on every mutant
        timeout-minutes: 330
        run: |
          prove=
          if [ "$SCOPE" != engine ]; then
            if [ "$UNTESTED" = true ]; then prove=--prove-only; else prove=--prove; fi
            prove="$prove --proof-timeout $([ -n "$IDS" ] && echo 18000 || echo 5400) ${PROOFS:+--proofs $PROOFS}"
          fi
          opam exec -- python3 test/mutate.py --scope "$SCOPE" ${IDS:+--id $IDS} --shard "${{ matrix.shard }}/$SHARDS" --seed "$SEED" --jobs 4 --timeout 2700 $prove --json "shard_${{ matrix.shard }}.jsonl"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-${{ matrix.shard }}
          path: shard_${{ matrix.shard }}.jsonl

  # every shard's results in one score, in-sample and held out apart, and every survivor
  score:
    needs: mutate
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the results
        uses: actions/download-artifact@v8
        with:
          pattern: mutation-*
          path: results
          merge-multiple: true

      - name: Score
        run: python3 test/mutate.py --report results/*.jsonl > report.txt

      - name: Summary
        if: always()
        run: |
          cat report.txt
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: |
            report.txt
            results
