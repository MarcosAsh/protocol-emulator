name: mutation
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
jobs:
  mutate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      # no z3: every QED in the tests is cadical's, checked by cake_lpr
      - name: Install dependencies
        run: opam install . --deps-only --with-test --locked

      # cadical and cake_lpr for the checked QEDs (test/checked_unsat.ml), at the pins
      # formal/Makefile names
      - name: Cache the SAT tools
        id: sat_tools
        uses: actions/cache@v4
        with:
          path: formal/sat_tools/bin
          key: sat-tools-${{ hashFiles('formal/Makefile') }}

      - name: Build the SAT tools
        run: |
          [ "${{ steps.sat_tools.outputs.cache-hit }}" = true ] || make -C formal sat_tools
          echo "$PWD/formal/sat_tools/bin" >> "$GITHUB_PATH"

      - name: Mutate the hardware and run the tests on every mutant
        shell: bash
        run: opam exec -- python3 test/mutate.py --jobs 4 | tee mutation.log

      - name: Score
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep "valid mutants\|^survived" -A1 mutation.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
