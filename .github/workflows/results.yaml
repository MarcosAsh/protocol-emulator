name: results

# RESULTS.md and the results page from the last green runs on main, each time one of them
# finishes. The pages workflow publishes the page.
on:
  workflow_run:
    workflows: [ocaml, gds, test, mutation, reject split]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: results
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  results:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Write the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 test/results.py --repo "${{ github.repository }}" --html results.html > RESULTS.md
          cat RESULTS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: |
            RESULTS.md
            results.html
