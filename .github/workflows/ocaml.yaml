name: ocaml
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      certificates: ${{ steps.certificates.outputs.names }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      # no z3: every QED in the tests is cadical's, checked by cake_lpr
      - name: Install dependencies
        run: opam install . --deps-only --with-test --locked

      # cadical and cake_lpr for the checked QEDs (test/checked_unsat.ml), at the pins
      # formal/Makefile names
      - name: Cache the SAT tools
        id: sat_tools
        uses: actions/cache@v4
        with:
          path: formal/sat_tools/bin
          key: sat-tools-${{ hashFiles('formal/Makefile') }}

      - name: Build the SAT tools
        run: |
          [ "${{ steps.sat_tools.outputs.cache-hit }}" = true ] || make -C formal sat_tools
          echo "$PWD/formal/sat_tools/bin" >> "$GITHUB_PATH"

      # the workflows that run the cocotb test have no assembler and read these
      - name: Check the committed firmware words are current
        run: |
          opam exec -- make -C test -f firmware.mk firmware
          if ! git diff --exit-code test/*.hex; then
            echo "::error::test/*.hex are stale, reassemble them: cd test && make firmware"
            exit 1
          fi

      - name: Run tests
        run: opam exec -- dune build @runtest

      # the chip is hardened from the committed file, not from the OCaml
      - name: Check the committed Verilog is current
        run: |
          opam exec -- dune exec -- bin/generate.exe top -sram -engines 2 > src/protocol_emulator.v
          if ! git diff --stat --exit-code src/protocol_emulator.v; then
            echo "::error file=src/protocol_emulator.v::stale, regenerate it: dune exec -- bin/generate.exe top -sram -engines 2 > src/protocol_emulator.v"
            exit 1
          fi

      - name: Install OSS CAD Suite
        run: |
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz | tar xz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: |
          opam exec -- dune exec -- bin/generate.exe engine > formal/engine.v
          opam exec -- dune exec -- bin/generate.exe engine -sram > formal/engine_sram.v
          opam exec -- dune exec -- bin/generate.exe kernel > formal/kernel_step.v
          opam exec -- dune exec -- bin/generate.exe engines -engines 2 > formal/engines.v
          opam exec -- dune exec -- bin/generate.exe engines -engines 2 -sram > formal/engines_sram.v
          opam exec -- dune exec -- bin/generate.exe engines -engines 2 -sram -journal > formal/engines_sram_journal.v
          opam exec -- dune exec -- bin/generate.exe data-memory > formal/data_memory.v
          opam exec -- dune exec -- bin/generate.exe data-memory -journal > formal/data_memory_journal.v
          opam exec -- dune exec -- test/certify/write_link.exe > formal/link.sv
          opam exec -- dune exec -- test/certify/write_link.exe -rx-period 11 > formal/link_baud.sv
          opam exec -- dune exec -- bin/generate.exe osr > formal/osr_step.v
          opam exec -- dune exec -- test/certify/write_certificate.exe -fsm > formal/fsm_miter.sv
          opam exec -- dune exec -- test/certify/write_certificate.exe -fsm -mutant > formal/fsm_miter_mutant.sv
          opam exec -- dune exec -- bin/generate.exe kernel-accepts > formal/kernel_accepts.v
          opam exec -- dune exec -- bin/generate.exe memory > formal/memory_flops.v
          opam exec -- dune exec -- bin/generate.exe memory -sram > formal/memory_sram.v
          opam exec -- dune exec -- bin/generate.exe kernel-gates > formal/kernel_gates.aag
          opam exec -- dune exec -- bin/generate.exe kernel-gates -accepts > formal/kernel_accepts_gates.aag
          make -C formal issue_timing host_timing late_host fifo_order phase_step edge_step frame_step value_step chip_frame data_step teeth fsm_miter_proof sram_equiv_proof kernel_equiv_proof sync_rtl sync_rtl_teeth journal_proof

      # each inductive certificate, the stamped one and the ones with data claims too, is
      # proved in a job of its own below
      - name: Write the certificates
        id: certificates
        run: |
          names=$(make -s -C formal inductive_names)
          for name in $names; do
            opam exec -- dune exec -- test/certify/write_certificate.exe -inductive $name > formal/certificate_$name.sv
          done
          opam exec -- dune exec -- test/certify/write_certificate.exe -inductive -stamped uart_tx_stamped > formal/certificate_stamped.sv
          data=""
          for name in $(make -s -C formal data_names); do
            opam exec -- dune exec -- test/certify/write_certificate.exe -inductive -data $name > formal/certificate_data_$name.sv
            data="$data data_$name"
          done
          echo "names=$(echo $names stamped $data | jq -Rc 'split(" ")')" >> "$GITHUB_OUTPUT"

      - name: Upload the certificates
        uses: actions/upload-artifact@v7
        with:
          name: certificates
          path: |
            formal/engine_sram.v
            formal/certificate_*.sv

      - name: Upload the Verilog of the uart link
        uses: actions/upload-artifact@v7
        with:
          name: link
          path: |
            formal/engines_sram.v
            formal/link.sv
            formal/link_baud.sv

      - name: Upload the Verilog of the one-run theorem
        uses: actions/upload-artifact@v7
        with:
          name: phase_table
          path: |
            formal/engine.v
            formal/kernel_step.v
            formal/kernel_accepts.v

      # the kit's top and pin file; tt is not part of this repository
      - name: Checkout tt-support-tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: Build for the FPGA kit and simulate the netlist
        run: |
          # the simulator loads OSS CAD Suite's cocotb, so no pip cocotb beside it
          cd test
          opam exec -- make fpga_fit
          python3 check_metrics.py --fpga fpga_kit.log >> "$GITHUB_STEP_SUMMARY"
          make FPGA=yes
          ! grep failure results.xml
          make replay FPGA=yes

      # the journal is a build option, so its chip is generated and simulated on its own
      - name: Simulate the chip with a journal
        run: opam exec -- make -C test journal

      # the chip's own Verilog, two engines and all, on the Icepi Zero's ECP5 at 48 MHz;
      # nextpnr fails the build if timing does
      - name: Build for the Icepi Zero and simulate the netlist
        run: |
          make -C icepi
          grep -h "TRELLIS_COMB:\|TRELLIS_FF:\|DP16KD:\|Max frequency" icepi/build/v1.4.log | tail -4 >> "$GITHUB_STEP_SUMMARY"
          cd test
          make icepi_netlist.v
          make ICEPI=yes
          ! grep failure results.xml
          make replay ICEPI=yes

  inductive_certificate:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.test.outputs.certificates) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the certificates
        uses: actions/download-artifact@v8
        with:
          name: certificates
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz | tar xz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      # the invariant by induction, then the teeth runs, which have to fail
      - name: Prove
        run: |
          case ${{ matrix.name }} in
            stamped) make -C formal stamped_proof ;;
            data_*) make -C formal data_proof NAME=$(echo ${{ matrix.name }} | sed 's/^data_//') ;;
            *) make -C formal inductive_proof NAME=${{ matrix.name }} ;;
          esac

  # the step lemma and the kernel's check in one run, and its teeth, which have to fail
  phase_table:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: phase_table
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz | tar xz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal phase_table_proof

  # the same for rows that bound the offset too, on row_step's lemma, and its teeth
  phase_table_affine:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: phase_table
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz | tar xz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal phase_table_affine_proof

  # a watched pair's spacing on the one-run theorem, its cover and tooth
  phase_spacing:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: phase_table
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz | tar xz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal phase_spacing_proof

  # the uart link between two engines by induction, its cover and teeth
  link:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: link
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz | tar xz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal link_proof

  # each step lemma's Certifaiger witness, every check's LRAT proof verified by cake_lpr,
  # and its teeth, whose models have to fail
  witness:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lemma: [phase_step, edge_step]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: phase_table
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz | tar xz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Cache the SAT tools
        id: sat_tools
        uses: actions/cache@v4
        with:
          path: formal/sat_tools/bin
          key: sat-tools-${{ hashFiles('formal/Makefile') }}

      - name: Build the SAT tools
        run: |
          [ "${{ steps.sat_tools.outputs.cache-hit }}" = true ] || make -C formal sat_tools
          echo "$PWD/formal/sat_tools/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal witness_proof LEMMA=${{ matrix.lemma }}
