name: ocaml
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      - name: Install dependencies
        run: |
          sudo apt-get install -y z3
          opam install . --deps-only --with-test --locked

      # the workflows that run the cocotb test have no assembler and read these
      - name: Check the committed firmware words are current
        run: |
          for f in test/*.asm; do
            opam exec -- dune exec -- bin/generate.exe assemble "$f" > "${f%.asm}.hex"
          done
          if ! git diff --exit-code test/*.hex; then
            echo "::error::test/*.hex are stale, reassemble them: cd test && make firmware"
            exit 1
          fi

      - name: Run tests
        run: opam exec -- dune build @runtest

      # the chip is hardened from the committed file, not from the OCaml
      - name: Check the committed Verilog is current
        run: |
          opam exec -- dune exec -- bin/generate.exe top -sram > src/protocol_emulator.v
          if ! git diff --stat --exit-code src/protocol_emulator.v; then
            echo "::error file=src/protocol_emulator.v::stale, regenerate it: dune exec -- bin/generate.exe top -sram > src/protocol_emulator.v"
            exit 1
          fi

      - name: Install OSS CAD Suite
        run: |
          curl -sL https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz | tar xz -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: |
          opam exec -- dune exec -- bin/generate.exe engine > formal/engine.v
          opam exec -- dune exec -- bin/generate.exe engine -sram > formal/engine_sram.v
          make -C formal issue_timing host_timing fifo_order teeth

      # the kit's top and pin file; tt is not part of this repository
      - name: Checkout tt-support-tools
        uses: actions/checkout@v6
        with:
          repository: TinyTapeout/tt-support-tools
          ref: ihp-sg13cmos5l
          path: tt

      - name: Build for the FPGA kit and simulate the netlist
        run: |
          # the simulator loads the cocotb that ships with the OSS CAD Suite, so its
          # makefiles have to be the ones in charge too: no pip cocotb beside it
          cd test
          opam exec -- make fpga_fit
          python3 check_metrics.py --fpga fpga_kit.log >> "$GITHUB_STEP_SUMMARY"
          make FPGA=yes
          ! grep failure results.xml
          make replay FPGA=yes
