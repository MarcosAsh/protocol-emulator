name: ocaml
# branches only, since a tag points at a commit a branch push already ran
on:
  push:
    branches: ['**']
  # phase_spacing (nine jobs of up to 3.5 h) only runs nightly on main and on a dispatch.
  # Before landing a branch: gh workflow run ocaml.yaml --ref BRANCH -f phase_spacing=true
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      phase_spacing:
        description: Prove phase_spacing too
        type: boolean
        default: false

# A newer push cancels a branch's run. On main every run that starts finishes, and of the
# ones waiting only the newest starts. The nightly and a dispatch queue separately from
# pushes, so a push never drops them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name != 'push' && format('-{0}', github.event_name) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # works out which jobs a branch's changes reach (.github/changed.sh). The rest are
  # skipped, which counts as a pass
  changes:
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.changed.outputs.tests }}
      proofs: ${{ steps.changed.outputs.proofs }}
      fpga: ${{ steps.changed.outputs.fpga }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # to find where the branch left main

      - name: List what changed
        id: changed
        run: .github/changed.sh tests proofs fpga | tee -a "$GITHUB_OUTPUT"

  # builds the Verilog and certificates the proof jobs read, so they don't wait for the tests
  generate:
    needs: changes
    if: needs.changes.outputs.proofs == 'true'
    runs-on: ubuntu-24.04
    # id-token and attestations are for signing the provenance of the proof bundle below
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      certificates: ${{ steps.certificates.outputs.names }}
      phase_spacing: ${{ steps.phase_spacing.outputs.parts }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      # oxcaml.latest needs the 5.4 compiler after their 5.4.0-ox9 merge; pinning here
      # rather than in opam-repositories keeps setup-ocaml's cache key
      - name: Pin the oxcaml opam repository
        run: opam repo set-url ox git+https://github.com/oxcaml/opam-repository.git#a70ed316f02290fa267f9105f30cf21e3c7f5f05

      # the switch as the lock built it; on a cache hit the install below does nothing
      - name: Cache the switch
        uses: actions/cache@v4
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.2.0+ox-test-${{ hashFiles('protocol_emulator.opam.locked') }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test --locked

      - name: Write the Verilog
        run: |
          opam exec -- dune exec -- bin/generate.exe engine > formal/engine.v
          opam exec -- dune exec -- bin/generate.exe engine -sram > formal/engine_sram.v
          opam exec -- dune exec -- bin/generate.exe engine -timer-bits 7 > formal/engine_narrow.v
          opam exec -- dune exec -- bin/generate.exe kernel > formal/kernel_step.v
          opam exec -- dune exec -- bin/generate.exe kernel -timer-bits 7 > formal/kernel_step_narrow.v
          opam exec -- dune exec -- bin/generate.exe engines -engines 2 -ungated > formal/engines.v
          opam exec -- dune exec -- bin/generate.exe engines -engines 2 -sram -ungated > formal/engines_sram.v
          opam exec -- dune exec -- bin/generate.exe engines -engines 2 -sram > formal/engines_gated.v
          opam exec -- dune exec -- test/certify/write_link.exe > formal/link.sv
          opam exec -- dune exec -- test/certify/write_link.exe -rx-period 11 > formal/link_baud.sv
          opam exec -- dune exec -- test/certify/write_bridge.exe > formal/bridge.sv
          opam exec -- dune exec -- test/certify/write_self_check.exe > formal/self_check.sv
          opam exec -- dune exec -- test/certify/write_self_check.exe -mutant stamp > formal/self_check_stamp.sv
          opam exec -- dune exec -- test/certify/write_self_check.exe -mutant least > formal/self_check_least.sv
          opam exec -- dune exec -- test/certify/write_self_check.exe -mutant silent > formal/self_check_silent.sv
          opam exec -- dune exec -- test/certify/write_self_check.exe -mutant slow > formal/self_check_slow.sv
          opam exec -- dune exec -- test/certify/write_self_check.exe -invariants > formal/self_check_clean.sv
          opam exec -- dune exec -- bin/generate.exe kernel-accepts > formal/kernel_accepts.v
          opam exec -- dune exec -- bin/generate.exe engines -engines 2 -sram > formal/engines_gated.v
          opam exec -- dune exec -- bin/generate.exe load-check-step > formal/load_check_step.v

      # every inductive certificate (the stamped one and the ones with data claims too) is
      # proved in its own job below
      - name: Write the certificates
        id: certificates
        run: |
          names=$(opam exec -- dune exec -- test/certify/write_certificate.exe -names)
          for name in $names; do
            opam exec -- dune exec -- test/certify/write_certificate.exe -inductive $name > formal/certificate_$name.sv
          done
          opam exec -- dune exec -- test/certify/write_certificate.exe -inductive -stamped uart_tx_stamped > formal/certificate_stamped.sv
          data=""
          for name in $(make -s -C formal data_names); do
            opam exec -- dune exec -- test/certify/write_certificate.exe -inductive -data $name > formal/certificate_data_$name.sv
            data="$data data_$name"
          done
          echo "names=$(echo $names stamped $data | jq -Rc 'split(" ")')" >> "$GITHUB_OUTPUT"

      - name: List the parts of the pair's spacing
        id: phase_spacing
        run: echo "parts=$(make -s -C formal phase_spacing_parts | jq -Rc 'split(" ")')" >> "$GITHUB_OUTPUT"

      # only for a push to main, so a fork's pull request never signs
      - name: Attest the proof bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v3.0.0
        with:
          subject-path: |
            formal/engine_sram.v
            formal/certificate_*.sv

      - name: Upload the certificates
        uses: actions/upload-artifact@v7
        with:
          name: certificates
          path: |
            formal/engine_sram.v
            formal/certificate_*.sv

      - name: Upload the Verilog of the uart link
        uses: actions/upload-artifact@v7
        with:
          name: link
          path: |
            formal/engines_sram.v
            formal/link.sv
            formal/link_baud.sv
            formal/bridge.sv

      - name: Upload the Verilog of the self-check
        uses: actions/upload-artifact@v7
        with:
          name: self_check
          path: |
            formal/engine_sram.v
            formal/self_check*.sv

      - name: Upload the Verilog of the narrow core
        uses: actions/upload-artifact@v7
        with:
          name: narrow
          path: |
            formal/engine_narrow.v
            formal/kernel_step_narrow.v

      - name: Upload the Verilog of the load checker's completeness
        uses: actions/upload-artifact@v7
        with:
          name: complete
          path: |
            formal/engines_gated.v
            formal/load_check_step.v

      - name: Upload the Verilog of the one-run theorem
        uses: actions/upload-artifact@v7
        with:
          name: phase_table
          path: |
            formal/engine.v
            formal/engines.v
            formal/kernel_step.v
            formal/kernel_accepts.v

  test:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      # oxcaml.latest needs the 5.4 compiler after their 5.4.0-ox9 merge; pinning here
      # rather than in opam-repositories keeps setup-ocaml's cache key
      - name: Pin the oxcaml opam repository
        run: opam repo set-url ox git+https://github.com/oxcaml/opam-repository.git#a70ed316f02290fa267f9105f30cf21e3c7f5f05

      - name: Cache the switch
        uses: actions/cache@v4
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.2.0+ox-test-${{ hashFiles('protocol_emulator.opam.locked') }}

      # no z3: every QED in the tests is cadical's, checked by cake_lpr
      - name: Install dependencies
        run: opam install . --deps-only --with-test --locked

      # cadical and cake_lpr for the checked QEDs (test/checked_unsat.ml), at the pins in
      # formal/Makefile (the cache key hashes only those lines)
      - name: Key the SAT tools
        id: sat_key
        run: echo "key=sat-tools-$(sed -n '/^CADICAL = /,/^$/p' formal/Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the SAT tools
        id: sat_tools
        uses: actions/cache@v4
        with:
          path: formal/sat_tools/bin
          key: ${{ steps.sat_key.outputs.key }}

      - name: Build the SAT tools
        run: |
          [ "${{ steps.sat_tools.outputs.cache-hit }}" = true ] || make -C formal sat_tools
          echo "$PWD/formal/sat_tools/bin" >> "$GITHUB_PATH"

      # the workflows that run the cocotb test have no assembler, so they read these
      - name: Check the committed firmware words are current
        run: |
          opam exec -- make -C test -f firmware.mk firmware
          if ! git diff --exit-code test/*.hex; then
            echo "::error::test/*.hex are stale, reassemble them: cd test && make firmware"
            exit 1
          fi

      - name: Check the tree is formatted
        run: opam exec -- dune build @fmt

      - name: Lint with Jane Street's style checker
        run: opam exec -- dune build @lint

      - name: Run tests
        run: opam exec -- dune build @runtest

      # test/board/kernel_vs_board's variants, made again and held to what the board ran
      - name: Board variants
        run: opam exec -- dune build @test/python/board_variants

      # the chip is hardened from the committed Verilog, not from the OCaml
      - name: Check the committed Verilog is current
        run: |
          opam exec -- dune exec -- bin/generate.exe top -sram -engines 2 > src/protocol_emulator.v
          if ! git diff --stat --exit-code src/protocol_emulator.v; then
            echo "::error file=src/protocol_emulator.v::stale, regenerate it: dune exec -- bin/generate.exe top -sram -engines 2 > src/protocol_emulator.v"
            exit 1
          fi

      - name: Install OSS CAD Suite
        if: needs.changes.outputs.proofs == 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        if: needs.changes.outputs.proofs == 'true'
        run: |
          opam exec -- dune exec -- bin/generate.exe engine > formal/engine.v
          opam exec -- dune exec -- bin/generate.exe engine -sram > formal/engine_sram.v
          opam exec -- dune exec -- bin/generate.exe engine -timer-bits 7 > formal/engine_narrow.v
          opam exec -- dune exec -- bin/generate.exe kernel > formal/kernel_step.v
          opam exec -- dune exec -- bin/generate.exe kernel -timer-bits 7 > formal/kernel_step_narrow.v
          opam exec -- dune exec -- bin/generate.exe engines -engines 2 -ungated > formal/engines.v
          opam exec -- dune exec -- bin/generate.exe engines -engines 2 -sram -ungated > formal/engines_sram.v
          opam exec -- dune exec -- bin/generate.exe engines -engines 2 -sram > formal/engines_gated.v
          opam exec -- dune exec -- test/certify/write_link.exe > formal/link.sv
          opam exec -- dune exec -- test/certify/write_link.exe -rx-period 11 > formal/link_baud.sv
          opam exec -- dune exec -- test/certify/write_bridge.exe > formal/bridge.sv
          opam exec -- dune exec -- bin/generate.exe osr > formal/osr_step.v
          opam exec -- dune exec -- test/certify/write_certificate.exe -fsm > formal/fsm_miter.sv
          opam exec -- dune exec -- test/certify/write_certificate.exe -fsm -mutant > formal/fsm_miter_mutant.sv
          opam exec -- dune exec -- test/certify/write_certificate.exe -verilog-corpus -out formal > formal/verilog_corpus.txt
          opam exec -- dune exec -- bin/generate.exe kernel-accepts > formal/kernel_accepts.v
          opam exec -- dune exec -- bin/generate.exe memory > formal/memory_flops.v
          opam exec -- dune exec -- bin/generate.exe memory -sram > formal/memory_sram.v
          opam exec -- dune exec -- bin/generate.exe kernel-gates > formal/kernel_gates.aag
          opam exec -- dune exec -- bin/generate.exe kernel-gates -accepts > formal/kernel_accepts_gates.aag
          opam exec -- dune exec -- bin/generate.exe top -engines 2 > formal/top.v
          opam exec -- dune exec -- bin/generate.exe usb-rx > formal/usb_frame_rx.v
          opam exec -- dune exec -- bin/generate.exe line-stuff > formal/line_stuff.v
          opam exec -- dune exec -- bin/generate.exe frame-rx > formal/frame_rx.v
          opam exec -- dune build test/translation/check_translation.exe
          make -C formal issue_timing host_timing host_spacing late_host fifo_order unreachable phase_step fetch_step edge_step event_step frame_step value_step narrow_proof chip_frame fail_safe isolation_proof data_step teeth fsm_miter_proof verilog_in_proof sram_equiv_proof kernel_equiv_proof translation_proof frontend_equiv sync_rtl sync_rtl_teeth powerup offset_axioms gate certify usb_roundtrip_proof line_stuff_proof frame_roundtrip_proof

  # Hardcaml's cyclesim coverage of src/ over every test. It reruns them, so it runs
  # beside the test job, in four shards as one runner comes near its six hours.
  coverage:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      # oxcaml.latest needs the 5.4 compiler after their 5.4.0-ox9 merge; pinning here
      # rather than in opam-repositories keeps setup-ocaml's cache key
      - name: Pin the oxcaml opam repository
        run: opam repo set-url ox git+https://github.com/oxcaml/opam-repository.git#a70ed316f02290fa267f9105f30cf21e3c7f5f05

      - name: Cache the switch
        uses: actions/cache@v4
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.2.0+ox-test-${{ hashFiles('protocol_emulator.opam.locked') }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test --locked

      # the tests' checked QEDs need these, as in the test job
      - name: Key the SAT tools
        id: sat_key
        run: echo "key=sat-tools-$(sed -n '/^CADICAL = /,/^$/p' formal/Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the SAT tools
        id: sat_tools
        uses: actions/cache@v4
        with:
          path: formal/sat_tools/bin
          key: ${{ steps.sat_key.outputs.key }}

      - name: Build the SAT tools
        run: |
          [ "${{ steps.sat_tools.outputs.cache-hit }}" = true ] || make -C formal sat_tools
          echo "$PWD/formal/sat_tools/bin" >> "$GITHUB_PATH"

      - name: Run the shard's tests
        run: COVERAGE_SHARD=${{ matrix.shard }}/4 opam exec -- dune build @test/coverage_reports

      - name: Upload the shard's reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: _build/default/test/coverage/

  # Every point the tests leave open is listed with a reason in test/coverage_triage.txt,
  # and a new one fails (test/check_coverage.py).
  coverage_check:
    needs: coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the shards' reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Check coverage
        run: |
          status=0
          python3 test/check_coverage.py test/coverage_triage.txt coverage > coverage_check.txt 2>&1 || status=$?
          cat coverage_check.txt
          { echo '```'; cat coverage_check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/
            coverage_check.txt

  # judges the pin traces with sigrok's protocol decoders, which we didn't write. Each
  # trace runs at the chip's clock and as a 24 MHz analyser samples it, with its teeth,
  # and once through the bench's path. The test job's runtest checks the traces are current.
  decode:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install sigrok-cli, numpy, which the edge reader needs, matplotlib and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y sigrok-cli python3-numpy python3-matplotlib ffmpeg

      - name: Fetch the drawn decoders newer than Ubuntu's sigrok
        run: demo/pinned_decoders.sh

      - name: Decode
        run: |
          sigrok-cli -V | head -1
          python3 demo/decode.py test/traces/*.trace test/traces/sigrok/*.trace
          python3 demo/decode.py --rate 24 --seed 1 test/traces/*.trace test/traces/sigrok/*.trace
          for trace in test/traces/uart_tx.trace test/traces/sigrok/can.trace test/traces/sigrok/ws2812.trace; do
            python3 demo/decode.py --rate 24 --seed 2 --write-capture bench.sr $trace
            python3 demo/decode.py --capture bench.sr $trace
          done

      - name: Check the i2c timing decoder
        run: python3 test/test_i2c_timing.py

      - name: Margins, on made 100 MHz captures against test/measure's predictions
        run: python3 test/test_hold_capture.py

      - name: Speed log
        run: python3 test/test_speed.py

      - name: Corpus pages
        run: python3 test/test_corpus.py

      - name: Ledger, against stand-ins for the bench's tools
        run: python3 test/test_ledger.py

      - name: Bench runner, against stand-ins for the bench's tools
        run: python3 test/test_bench_run.py

      - name: Traffic checks, on made captures
        run: python3 test/test_traffic.py

      # the real bench captures in test/board: checks their hashes, sigrok's decode, the
      # bytes, the datasheet windows and each capture's teeth
      - name: Board witnesses
        run: python3 demo/witness.py check test/board/*/

      - name: Board witnesses' own teeth
        run: python3 test/test_witness.py

      - name: Carrier self-test, on a model of the board
        run: python3 test/test_carrier_check.py

      - name: Lab pins, from the carrier netlist
        run: python3 test/test_lab_pins.py

      - name: Lab worker, against stand-ins for the bench's tools
        run: python3 test/test_lab_worker.py

  # simulates the netlists of both boards. The firmware words they load are the committed
  # ones, and the test job checks those are current. On the 8x4 chip the tests and the
  # replays each come near a runner's six hours, so each runs in two halves
  fpga:
    needs: changes
    if: needs.changes.outputs.fpga == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: tests
            half: slow
          - part: tests
            half: rest
          - part: replay
            traces: traces/[a-o]*.trace
          - part: replay
            traces: traces/[p-z]*.trace
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up OxCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+ox
          opam-repositories: |
            ox: https://github.com/oxcaml/opam-repository.git
            default: https://opam.ocaml.org

      # oxcaml.latest needs the 5.4 compiler after their 5.4.0-ox9 merge; pinning here
      # rather than in opam-repositories keeps setup-ocaml's cache key
      - name: Pin the oxcaml opam repository
        run: opam repo set-url ox git+https://github.com/oxcaml/opam-repository.git#a70ed316f02290fa267f9105f30cf21e3c7f5f05

      - name: Cache the switch
        uses: actions/cache@v4
        with:
          path: _opam
          key: opam-${{ runner.os }}-${{ runner.arch }}-5.2.0+ox-test-${{ hashFiles('protocol_emulator.opam.locked') }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test --locked

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      # The kit's iCE40 UP5K was at 85% of its cells before the load checker, which needs
      # about 2k more, so the chip runs on the Icepi Zero below instead.

      # the chip's own Verilog, both engines included, on the Icepi Zero's ECP5 at 48 MHz.
      # nextpnr fails the build if timing fails
      - name: Build for the Icepi Zero and simulate the netlist
        run: |
          make -C icepi
          grep -h "TRELLIS_COMB:\|TRELLIS_FF:\|DP16KD:\|Max frequency" icepi/build/v1.4.log | tail -4 >> "$GITHUB_STEP_SUMMARY"
          cd test
          make icepi_netlist.v
          if [ "${{ matrix.part }}" = tests ]; then
            make ICEPI=yes HALF=${{ matrix.half }}
            ! grep failure results.xml
          else
            REPLAY_TRACES='${{ matrix.traces }}' make replay ICEPI=yes
          fi

  # proves the Icepi Zero's build equals the RTL (formal/icepi_equiv), using synth_ecp5's
  # netlist for each bitstream the bench loads, plus the teeth on the 48 MHz one. Then it
  # builds the bitstream and its .sha256, which a board run's evidence quotes. About 10 min,
  # or 20 with the teeth
  icepi_equiv:
    needs: changes
    if: needs.changes.outputs.fpga == 'true' || needs.changes.outputs.proofs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        mhz: [48, 40]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove the netlist equal to the RTL
        run: make -C icepi equiv MHZ=${{ matrix.mhz }}

      - name: Fail on four mutants
        if: matrix.mhz == 48
        run: make -C formal icepi_equiv_teeth

      - name: Build the bitstream and name it
        run: |
          make -C icepi MHZ=${{ matrix.mhz }}
          cat icepi/build/*.sha256 >> "$GITHUB_STEP_SUMMARY"

      # the bitstream the proof names, ready for a board run to load as is
      - name: Keep the bitstream
        uses: actions/upload-artifact@v7
        with:
          name: icepi-${{ matrix.mhz }}mhz
          path: |
            icepi/build/*.bit
            icepi/build/*.sha256

  inductive_certificate:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.generate.outputs.certificates) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the certificates
        uses: actions/download-artifact@v8
        with:
          name: certificates
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      # proves the invariant by induction, then runs the teeth, which have to fail
      - name: Prove
        run: |
          case ${{ matrix.name }} in
            stamped) make -C formal stamped_proof ;;
            data_*) make -C formal data_proof NAME=$(echo ${{ matrix.name }} | sed 's/^data_//') ;;
            *) make -C formal inductive_proof NAME=${{ matrix.name }} ;;
          esac

  # proves the step lemma and the kernel's check in one run, then runs the teeth, which have
  # to fail
  phase_table:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: phase_table
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal phase_table_proof

  # the same on each engine inside the two-engine chip, with the fail-safe as a corollary,
  # plus the teeth, which have to fail
  fail_safe_table:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: phase_table
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal fail_safe_table_proof

  # the same for rows that bound the offset too, using row_step's lemma, plus the teeth
  phase_table_affine:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: phase_table
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal phase_table_affine_proof

  # proves a watched pair's spacing from the one-run theorem, with its cover and tooth, in
  # the parts phase_spacing_parts lists. Together they make phase_spacing_proof
  phase_spacing:
    needs: generate
    if: github.event_name == 'schedule' || inputs.phase_spacing
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.generate.outputs.phase_spacing) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: phase_table
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal phase_spacing_part PART=${{ matrix.part }}

  # the step lemma on the narrow core, where a timer that stops at its top must fail
  saturating:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: narrow
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal saturating_proof

  # proves the self-check checker against its contract from the clear, with covers and
  # teeth, and by induction for all time until a break
  self_check:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: self_check
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal self_check_proof self_check_clean_proof

  # proves the uart link between two engines and the bridge across both, by induction,
  # with covers and teeth
  link:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: link
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal link_proof bridge_proof

  # proves by induction that the load checker's verdict is the load check's walk's, with
  # covers and teeth
  complete:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: complete
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal complete_proof

  # builds each step lemma's and the self-check's Certifaiger witness, verifies every
  # check's LRAT proof with cake_lpr, and runs the teeth, whose models must fail.
  # phase_table's is too big for a hosted runner
  witness:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lemma: [phase_step, edge_step, event_step, frame_step, value_step, self_check_clean, fail_safe]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Download the Verilog
        uses: actions/download-artifact@v8
        with:
          name: phase_table
          path: formal

      - name: Download the Verilog of the self-check
        uses: actions/download-artifact@v8
        with:
          name: self_check
          path: formal

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/oss-cad-suite.tgz" \
            https://github.com/YosysHQ/oss-cad-suite-build/releases/download/2026-09-16/oss-cad-suite-linux-x64-20260916.tgz
          tar xzf "$RUNNER_TEMP/oss-cad-suite.tgz" -C "$HOME"
          echo "$HOME/oss-cad-suite/bin" >> "$GITHUB_PATH"

      - name: Key the SAT tools
        id: sat_key
        run: echo "key=sat-tools-$(sed -n '/^CADICAL = /,/^$/p' formal/Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache the SAT tools
        id: sat_tools
        uses: actions/cache@v4
        with:
          path: formal/sat_tools/bin
          key: ${{ steps.sat_key.outputs.key }}

      - name: Build the SAT tools
        run: |
          [ "${{ steps.sat_tools.outputs.cache-hit }}" = true ] || make -C formal sat_tools
          echo "$PWD/formal/sat_tools/bin" >> "$GITHUB_PATH"

      - name: Prove
        run: make -C formal witness_proof LEMMA=${{ matrix.lemma }}
