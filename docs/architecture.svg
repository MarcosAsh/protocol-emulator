      <path d="M0 0 L10 5 L0 10 z" fill="#4a6fa5"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#4a6fa5"/>
    </marker>
  </defs>
  <g font-size="13" fill="#1f2933" text-anchor="middle">
    <text x="60" y="206" font-weight="600">host</text>
    <text x="60" y="224" font-size="11" fill="#52606d">SPI, 4 pins</text>
