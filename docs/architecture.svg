    <text x="227" y="200" font-size="11">check registers</text>
    <text x="227" y="216" font-size="11" fill="#52606d">base, loaded, flags,</text>
    <text x="227" y="232" font-size="11" fill="#52606d">status, reject pc, reason</text>
