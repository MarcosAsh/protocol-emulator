    <text x="378" y="268" font-size="11" fill="#52606d" text-anchor="start">certified</text>
    <rect x="430" y="20" width="230" height="130" rx="6" fill="#eef3fa" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="545" y="44" font-weight="600">engine 0</text>
