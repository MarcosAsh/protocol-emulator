    <line x1="660" y1="140" x2="698" y2="180" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <line x1="660" y1="214" x2="698" y2="214" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <line x1="660" y1="288" x2="698" y2="248" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <line x1="660" y1="60" x2="806" y2="60" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <line x1="660" y1="368" x2="806" y2="368" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <text x="826" y="64" font-size="11" text-anchor="start">pins</text>
    <text x="826" y="372" font-size="11" text-anchor="start">pins</text>
    <text x="430" y="436" font-size="11" fill="#52606d">6 x 4 Tiny Tapeout tiles on IHP CMOS5L, three IHP SRAM macros, generated from Hardcaml</text>
  </g>
