<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a6fa5"/>
    </marker>
    <marker id="c" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M10 0 L0 5 L10 10 z" fill="#4a6fa5"/>
    </marker>
  </defs>
  <g font-size="13" fill="#1f2933" text-anchor="middle">
    <text x="60" y="152" font-weight="600">host</text>
    <text x="60" y="170" font-size="11" fill="#52606d">SPI, 4 pins</text>
    <line x1="96" y1="160" x2="142" y2="160" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <rect x="144" y="70" width="166" height="180" rx="6" fill="#eef3fa" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="227" y="100" font-weight="600">host port</text>
    <text x="227" y="122" font-size="11" fill="#52606d">register map</text>
    <text x="227" y="140" font-size="11" fill="#52606d">program load</text>
    <text x="227" y="158" font-size="11" fill="#52606d">tx and rx fifos per engine</text>
    <text x="227" y="176" font-size="11" fill="#52606d">debug: break, step, read back</text>
    <text x="227" y="194" font-size="11" fill="#52606d">config: side set, shifts,</text>
    <text x="227" y="210" font-size="11" fill="#52606d">CRC, stuffing, Manchester</text>
    <line x1="310" y1="115" x2="340" y2="115" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <line x1="310" y1="205" x2="340" y2="205" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <rect x="342" y="20" width="230" height="130" rx="6" fill="#eef3fa" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="457" y="44" font-weight="600">engine 0</text>
    <text x="457" y="64" font-size="11" fill="#52606d">24-bit clock, deadline t, period p</text>
    <text x="457" y="80" font-size="11" fill="#52606d">capture unit stamps an input edge</text>
    <text x="457" y="96" font-size="11" fill="#52606d">CRC and bit stuffing in the shifter</text>
    <rect x="360" y="108" width="194" height="30" rx="4" fill="#ffffff" stroke="#4a6fa5"/>
    <text x="457" y="128" font-size="11">program SRAM 512 x 16</text>
    <rect x="342" y="170" width="230" height="130" rx="6" fill="#eef3fa" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="457" y="194" font-weight="600">engine 1</text>
    <text x="457" y="214" font-size="11" fill="#52606d">the same, its own program</text>
    <text x="457" y="230" font-size="11" fill="#52606d">and its own pins</text>
    <rect x="360" y="258" width="194" height="30" rx="4" fill="#ffffff" stroke="#4a6fa5"/>
    <text x="457" y="278" font-size="11">program SRAM 512 x 16</text>
    <rect x="596" y="118" width="124" height="84" rx="6" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="658" y="150" font-size="11">data SRAM</text>
    <text x="658" y="166" font-size="11">512 x 16</text>
    <text x="658" y="184" font-size="11" fill="#52606d">a turn each</text>
    <line x1="572" y1="140" x2="594" y2="150" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <line x1="572" y1="180" x2="594" y2="170" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <line x1="572" y1="60" x2="700" y2="60" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <line x1="572" y1="260" x2="700" y2="260" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <text x="722" y="64" font-size="11" text-anchor="start">pins</text>
    <text x="722" y="264" font-size="11" text-anchor="start">pins</text>
    <text x="380" y="318" font-size="11" fill="#52606d">6 x 4 Tiny Tapeout tiles on IHP CMOS5L, three IHP SRAM macros, generated from Hardcaml</text>
  </g>
