    <text x="545" y="228" font-size="11" fill="#52606d">against the certificate, pc by pc,</text>
    <text x="545" y="244" font-size="11" fill="#52606d">with the kernel's own conjuncts</text>
    <line x1="545" y1="170" x2="545" y2="140" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
