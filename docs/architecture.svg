    <line x1="310" y1="214" x2="428" y2="214" stroke="#4a6fa5" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#b)"/>
    <line x1="310" y1="115" x2="332" y2="115" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#b)"/>
    <rect x="334" y="92" width="76" height="46" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="372" y="111" font-size="11">start gate</text>
    <text x="372" y="127" font-size="11" fill="#52606d">else refused</text>
    <line x1="410" y1="115" x2="428" y2="115" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#b)"/>
    <line x1="310" y1="313" x2="332" y2="313" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#b)"/>
    <rect x="334" y="290" width="76" height="46" rx="4" fill="#ffffff" stroke="#4a6fa5" stroke-width="1.5"/>
    <text x="372" y="309" font-size="11">start gate</text>
    <text x="372" y="325" font-size="11" fill="#52606d">else refused</text>
    <line x1="410" y1="313" x2="428" y2="313" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#b)"/>
